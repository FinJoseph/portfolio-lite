services:
  - type: web
    name: finjoseph
    runtime: docker
    region: frankfurt
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://finjoseph.onrender.com
      - key: APP_LOCALE
        value: fr
      - key: LOG_LEVEL
        value: warning
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: MAIL_MAILER
        value: log
      - key: DB_CONNECTION
        value: sqlite
